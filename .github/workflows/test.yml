name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GHIDRA_CLI_SOURCE_REVISION: ${{ github.sha }}
  # Ghidra 12 rejects path components starting with '.'.
  # On Linux the default cache dir (~/.cache) is rejected; use a clean path.
  GHIDRA_PROJECT_DIR: ${{ github.workspace }}/ghidra-projects
  # Opt into Node.js 24 for actions (Node.js 20 deprecated, removed Sep 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Job 1: Unit tests and CLI tests (no Ghidra needed) - ~2 min
  unit-and-cli:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Build test fixture
        run: rustc --edition 2021 -o tests/fixtures/sample_binary tests/fixtures/sample_binary.rs

      - name: Run unit tests
        run: cargo test --lib --verbose -- --test-threads=1

      - name: Run CLI tests
        run: cargo test --test e2e --test doctor_tests --test output_format_integration --verbose -- --test-threads=1

  # Job 2: Ghidra setup - installs Ghidra and creates test projects to seed caches.
  # This runs once per OS, then test jobs use the cached artifacts.
  ghidra-setup:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cache Ghidra installation and config
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/ghidra-cli
            ~/.ghidra
            ~/.config/ghidra-cli
            ~/Library/Application Support/ghidra-cli
            ~/Library/Preferences/ghidra-cli
            ~/AppData/Local/ghidra-cli
            ~/AppData/Roaming/ghidra-cli
          key: ghidra-${{ matrix.os }}-${{ hashFiles('ghidra-version') }}-v7

      - name: Cache Ghidra projects
        id: project-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra-projects
          key: ghidra-projects-${{ matrix.os }}-${{ hashFiles('ghidra-version') }}-v7-${{ hashFiles('tests/fixtures/sample_binary.rs') }}

      - name: Build
        run: cargo build --verbose

      - name: Build test fixture
        run: rustc --edition 2021 -o tests/fixtures/sample_binary tests/fixtures/sample_binary.rs

      - name: Setup Ghidra (skip if cached)
        run: bash scripts/setup-ci.sh
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create test project (skip if cached)
        run: |
          cargo run -- import tests/fixtures/sample_binary --project ci-test --program sample_binary
          cargo run -- analyze --project ci-test --program sample_binary
        shell: bash
        timeout-minutes: 20

  # Job 3: Read-only integration tests (one bridge)
  readonly-integration:
    needs: ghidra-setup
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Windows: test_program_close hangs inside analyzeHeadless's own JVM
    # teardown on some runners, well after the bridge already answers the
    # shutdown request successfully — reproduced as an 80-minute timeout
    # multiple times, unrelated to the Rust/Java code under test. Two fix
    # attempts (stop_bridge via API instead of a subprocess; a forced
    # System.exit()+Runtime.halt() in the bridge script, which broke project
    # state on exit instead) didn't resolve it. Don't block merges on a
    # Windows-only, non-deterministic Ghidra/JVM shutdown issue; still run it
    # so regressions are visible, just don't fail the workflow on it.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Restore Ghidra installation and config
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/ghidra-cli
            ~/.ghidra
            ~/.config/ghidra-cli
            ~/Library/Application Support/ghidra-cli
            ~/Library/Preferences/ghidra-cli
            ~/AppData/Local/ghidra-cli
            ~/AppData/Roaming/ghidra-cli
          key: ghidra-${{ matrix.os }}-${{ hashFiles('ghidra-version') }}-v7

      - name: Restore Ghidra projects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra-projects
          key: ghidra-projects-${{ matrix.os }}-${{ hashFiles('ghidra-version') }}-v7-${{ hashFiles('tests/fixtures/sample_binary.rs') }}

      - name: Build
        run: cargo build --verbose

      - name: Build test fixture
        run: rustc --edition 2021 -o tests/fixtures/sample_binary tests/fixtures/sample_binary.rs

      - name: Setup Ghidra (fallback if cache missed)
        run: bash scripts/setup-ci.sh
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove macOS quarantine from Ghidra (macOS only)
        if: runner.os == 'macOS'
        run: |
          find "$HOME/Library/Application Support/ghidra-cli" -name "decompile" -exec xattr -d com.apple.quarantine {} \; 2>/dev/null || true
          find "$HOME/.local/share/ghidra-cli" -name "decompile" -exec xattr -d com.apple.quarantine {} \; 2>/dev/null || true
        shell: bash

      - name: Run read-only integration tests
        run: cargo test --test readonly_tests --test command_tests --verbose -- --nocapture --test-threads=1
        timeout-minutes: 80
        env:
          RUST_LOG: info

  # Job 4: Mutation tests (parallel with job 3)
  mutation-integration:
    needs: ghidra-setup
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Restore Ghidra installation and config
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/ghidra-cli
            ~/.ghidra
            ~/.config/ghidra-cli
            ~/Library/Application Support/ghidra-cli
            ~/Library/Preferences/ghidra-cli
            ~/AppData/Local/ghidra-cli
            ~/AppData/Roaming/ghidra-cli
          key: ghidra-${{ matrix.os }}-${{ hashFiles('ghidra-version') }}-v7

      - name: Restore Ghidra projects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra-projects
          key: ghidra-projects-${{ matrix.os }}-${{ hashFiles('ghidra-version') }}-v7-${{ hashFiles('tests/fixtures/sample_binary.rs') }}

      - name: Build
        run: cargo build --verbose

      - name: Build test fixture
        run: rustc --edition 2021 -o tests/fixtures/sample_binary tests/fixtures/sample_binary.rs

      - name: Setup Ghidra (fallback if cache missed)
        run: bash scripts/setup-ci.sh
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove macOS quarantine from Ghidra (macOS only)
        if: runner.os == 'macOS'
        run: |
          find "$HOME/Library/Application Support/ghidra-cli" -name "decompile" -exec xattr -d com.apple.quarantine {} \; 2>/dev/null || true
          find "$HOME/.local/share/ghidra-cli" -name "decompile" -exec xattr -d com.apple.quarantine {} \; 2>/dev/null || true
        shell: bash

      - name: Run mutation integration tests
        run: cargo test --test comment_tests --test symbol_tests --test patch_tests --test type_tests --test script_tests --test signature_tests --test discovery_tests --test identity_tests --test function_mutation_tests --verbose -- --nocapture --test-threads=1
        timeout-minutes: 80
        env:
          RUST_LOG: info

  # Job 5: Infrastructure tests (parallel with jobs 3+4)
  infrastructure:
    needs: ghidra-setup
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Restore Ghidra installation and config
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/ghidra-cli
            ~/.ghidra
            ~/.config/ghidra-cli
            ~/Library/Application Support/ghidra-cli
            ~/Library/Preferences/ghidra-cli
            ~/AppData/Local/ghidra-cli
            ~/AppData/Roaming/ghidra-cli
          key: ghidra-${{ matrix.os }}-${{ hashFiles('ghidra-version') }}-v7

      - name: Restore Ghidra projects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra-projects
          key: ghidra-projects-${{ matrix.os }}-${{ hashFiles('ghidra-version') }}-v7-${{ hashFiles('tests/fixtures/sample_binary.rs') }}

      - name: Build
        run: cargo build --verbose

      - name: Build test fixture
        run: rustc --edition 2021 -o tests/fixtures/sample_binary tests/fixtures/sample_binary.rs

      - name: Setup Ghidra (fallback if cache missed)
        run: bash scripts/setup-ci.sh
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove macOS quarantine from Ghidra (macOS only)
        if: runner.os == 'macOS'
        run: |
          find "$HOME/Library/Application Support/ghidra-cli" -name "decompile" -exec xattr -d com.apple.quarantine {} \; 2>/dev/null || true
          find "$HOME/.local/share/ghidra-cli" -name "decompile" -exec xattr -d com.apple.quarantine {} \; 2>/dev/null || true
        shell: bash

      - name: Run infrastructure tests
        run: cargo test --test daemon_tests --test reliability_tests --test project_tests --verbose -- --nocapture --test-threads=1
        timeout-minutes: 80
        env:
          RUST_LOG: info

  docker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build fixture
        run: rustc --edition 2021 -o tests/fixtures/sample_binary tests/fixtures/sample_binary.rs
      - name: Build static discovery fixture
        run: |
          rustc --edition 2021 tests/fixtures/discovery_fixture.rs -o /tmp/discovery-fixture
          /tmp/discovery-fixture tests/fixtures/discovery.elf
      - name: Build pinned runtime
        run: docker build --build-arg GHIDRA_CLI_SOURCE_REVISION -t ghidra-cli:ci .
      - name: Test persistent container
        run: |
          mkdir -p runtime-projects
          docker run -d --name ghidra-cli-ci --entrypoint sleep \
            -v "$PWD/runtime-projects:/projects" \
            -v "$PWD/tests/fixtures:/binaries:ro" \
            -v "$PWD/tests/fixtures/runtime-scripts:/smoke:ro" ghidra-cli:ci infinity
          python3 scripts/smoke-runtime.py --project /projects/smoke \
            --fixture /binaries/sample_binary --script /smoke/RuntimeProbe.java \
            -- docker exec ghidra-cli-ci ghidra-cli
          docker exec ghidra-cli-ci /opt/ghidra/current/support/analyzeHeadless \
            /projects discovery -import /binaries/discovery.elf -noanalysis
          python3 scripts/smoke-discovery.py --project /projects/discovery \
            -- docker exec ghidra-cli-ci ghidra-cli
          docker exec ghidra-cli-ci /opt/ghidra/current/support/analyzeHeadless \
            /projects preparation -import /binaries/discovery.elf -noanalysis
          python3 scripts/smoke-prepare.py --project /projects/preparation \
            -- docker exec ghidra-cli-ci ghidra-cli
          docker rm -f ghidra-cli-ci
          docker run -d --name ghidra-cli-ci --entrypoint sleep \
            -v "$PWD/runtime-projects:/projects" ghidra-cli:ci infinity
          docker exec ghidra-cli-ci ghidra-cli decompile add_numbers --project /projects/smoke --program sample_binary
      - name: Cleanup
        if: always()
        run: docker rm -f ghidra-cli-ci
